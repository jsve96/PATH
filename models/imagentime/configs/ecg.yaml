# training:
epochs: 1000
batch_size: 128
learning_rate: 0.0001
weight_decay: 0.00001

# data:
dataset: ecg
seq_len: 140
use_stft: false

# transform:
delay: 9
embedding: 16

# model:
img_resolution: 16
input_channels: 1
unet_channels: 128
ch_mult: [1, 2, 2, 4]
attn_resolution: [16, 8, 4]

# diffusion:
diffusion_steps: 18
ema: true
ema_warmup: 100

# logging:
logging_iter: 100